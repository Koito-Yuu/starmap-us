<!DOCTYPE html>
<html lang="zh-CN" data-scheme="us" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="星图 STARMAP · 集行情、基本面、财报深读、选股、对比、组合与宏观于一体的美股投研终端">
  <meta name="theme-color" content="#f5f6f8">
  <title>星图 STARMAP · 美股投研终端</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('starmap.settings.v1');
        var theme = raw && JSON.parse(raw).theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0d1118' : '#f5f6f8');
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070c16'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%235ad1ff'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/noto-sans-sc-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/vendor/echarts.min.js" as="script">
  <link rel="modulepreload" href="assets/js/main.js">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/watchlist.css">
  <link rel="stylesheet" href="assets/css/macro.css">
  <link rel="stylesheet" href="assets/css/mda.css">
  <link rel="stylesheet" href="assets/css/portfolio.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-collapse" id="sidebar-collapse" type="button" title="收起侧栏" aria-label="收起侧栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>
      </button>
      <a class="brand" href="#/overview" aria-label="星图 STARMAP 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="17" stroke="url(#brandStroke)" stroke-width="1.2" opacity=".65"/>
            <circle cx="24" cy="24" r="3.4" fill="#5ad1ff"/>
            <path d="M24 4.5v7M24 36.5v7M4.5 24h7M36.5 24h7" stroke="url(#brandStroke)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M24 12.4l3.4 8.2 8.2 3.4-8.2 3.4L24 35.6l-3.4-8.2-8.2-3.4 8.2-3.4z" stroke="#8b93ff" stroke-width="1.3" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="brandStroke" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#5ad1ff"/><stop offset="1" stop-color="#8b93ff"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">
          <strong>STARMAP</strong>
          <small>星图 · 美股投研终端</small>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-link" data-nav="overview" href="#/overview">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></svg></span>
          <span class="nav-text">市场总览<small>PULSE</small></span>
        </a>
        <a class="nav-link" data-nav="screener" href="#/screener">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg></span>
          <span class="nav-text">智能选股<small>SCREENER</small></span>
        </a>
        <a class="nav-link" data-nav="watchlist" href="#/watchlist">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.7 6.1.8-4.5 4.3 1.1 6.1-5.4-3-5.4 3 1.1-6.1L3.2 10l6.1-.8z"/></svg></span>
          <span class="nav-text">自选研究<small>WATCHLIST</small></span>
        </a>
        <a class="nav-link" data-nav="compare" href="#/compare">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M10 7h5a2 2 0 0 1 2 2v5M14 17H9a2 2 0 0 1-2-2V9"/></svg></span>
          <span class="nav-text">多股对比<small>COMPARE</small></span>
        </a>
        <a class="nav-link" data-nav="fund" href="#/fund">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17l5.5-5.5 4 4L20 8"/><path d="M14.5 8H20v5.5"/><path d="M3 21h18"/></svg></span>
          <span class="nav-text">基金档案<small>FUNDS</small></span>
        </a>
        <a class="nav-link" data-nav="portfolio" href="#/portfolio">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12.5" rx="2.4"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5M3 12.5h18M10.5 12.5v2h3v-2"/></svg></span>
          <span class="nav-text">组合回测<small>PORTFOLIO</small></span>
        </a>
        <a class="nav-link" data-nav="macro" href="#/macro">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 13h4l2.5-7 4 13 2.5-7H21"/></svg></span>
          <span class="nav-text">宏观雷达<small>MACRO</small></span>
        </a>
      </nav>

      <section class="watch-panel" id="watch-panel" aria-label="自选股">
        <div class="watch-head">
          <button class="watch-title" id="watch-toggle" type="button" aria-expanded="true" title="折叠自选">
            <svg class="watch-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.7 5.7 6.1.8-4.5 4.3 1.1 6.1-5.4-3-5.4 3 1.1-6.1L3.2 10l6.1-.8z"/></svg>
            <span>我的自选</span>
            <span class="watch-count" id="watch-count">0</span>
          </button>
          <div class="watch-tools">
            <button class="watch-tool" id="watch-compare" type="button" title="对比全部自选（最多 6 只）" aria-label="对比全部自选">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="17" r="2.6"/><path d="M9.6 7H14a2.5 2.5 0 0 1 2.5 2.5v5M14.4 17H10a2.5 2.5 0 0 1-2.5-2.5v-5"/></svg>
            </button>
            <button class="watch-tool" id="watch-add-btn" type="button" title="添加自选" aria-label="添加自选">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <form class="watch-add" id="watch-add" hidden>
          <input id="watch-input" type="text" placeholder="输入代码，如 AMD" maxlength="8" autocomplete="off" spellcheck="false" aria-label="添加自选代码">
          <button type="submit" title="确认添加" aria-label="确认添加">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </button>
        </form>
        <div class="watch-list" id="watch-list" role="list" aria-live="polite"></div>
        <div class="watch-empty" id="watch-empty" hidden>暂无自选，点击 + 添加代码开始跟踪。</div>
      </section>

      <div class="sidebar-foot">
        <div class="source-line">
          <span class="live-dot"></span>
          <span>公开市场数据</span>
        </div>
        <p class="source-mini">Eastmoney · SEC EDGAR · Nasdaq · FRED</p>
        <p class="source-mini">数据可能存在延迟，仅供研究参考</p>
        <div class="version">STARMAP v1.0 <span>LOCAL</span></div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <span class="crumb-eyebrow" id="page-eyebrow">MARKET OVERVIEW</span>
          <h1 id="page-title">市场总览</h1>
        </div>

        <div class="search-wrap" id="search-wrap">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.5 4.5"/></svg>
            </span>
            <input id="global-search" type="text" placeholder="搜索代码或公司，例如 NVDA / 苹果" autocomplete="off" spellcheck="false" aria-label="搜索美股">
            <kbd>/</kbd>
          </div>
          <div class="search-results" id="search-results" hidden></div>
        </div>

        <div class="topbar-right">
          <div class="market-clock" id="market-clock" title="美股常规交易时段（美东时间）">
            <span class="clock-dot" id="clock-dot"></span>
            <span class="clock-et" id="clock-time">--:--:--</span>
            <span class="clock-state" id="clock-state">同步中</span>
          </div>
          <button class="icon-btn theme-btn" id="theme-toggle" title="切换明暗主题" aria-label="切换明暗主题" aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
            <span id="theme-label">亮色</span>
          </button>
          <button class="icon-btn scheme-btn" id="scheme-toggle" title="切换涨跌配色（美式：绿涨红跌 / 中式：红涨绿跌）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-1-.12-1.48A7 7 0 0 1 12 3z"/><path d="M12 3v18"/></svg>
            <span id="scheme-label">美式</span>
          </button>
          <button class="icon-btn" id="refresh-btn" title="刷新当前视图" aria-label="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          </button>
        </div>
      </header>

      <main id="view-root" class="main" aria-live="polite"></main>

      <footer class="app-footer">
        <span>STARMAP · 星图 美股投研终端</span>
        <span>行情可能延迟 · 仅供研究，不构成投资建议</span>
      </footer>
    </div>
  </div>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="assets/vendor/echarts.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
